# Fetches the published site and reports exactly what is being served.
#
# The development environment cannot reach ccrocker13.github.io (egress policy),
# so when the live site misbehaves there is no way to inspect it from there.
# A runner can. This prints the real response so a diagnosis rests on the served
# bytes rather than on inference.
name: Probe published site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-site.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the published site
        env:
          SITE: https://ccrocker13.github.io/bajasaestandings/
        shell: bash
        run: |
          # GitHub runs step shells as `bash -e`, so errexit is on unless it is
          # turned off here — a previous version of this step aborted on its
          # first non-zero command and reported nothing at all. This job exists
          # to describe a broken site, so no single failing command may end it.
          set +e
          set +o pipefail

          # Written to a file rather than piped into head: head closing the pipe
          # early makes curl exit 23, which also took this step down once.
          touch /tmp/body.html
          code=$(curl -sSL --max-time 30 -o /tmp/body.html -w '%{http_code}' "$SITE")
          [ -z "$code" ] && code=000

          # Print the verdict to stdout before anything else, so it survives
          # even if a later command misbehaves.
          echo "=== PROBE RESULT ==="
          echo "URL:   $SITE"
          echo "HTTP:  $code"
          echo "BYTES: $(wc -c < /tmp/body.html | tr -d ' ')"
          if grep -q '/assets/index-' /tmp/body.html; then
            echo "VERDICT: built site IS being served"
          elif grep -q "isn't a GitHub Pages site here" /tmp/body.html; then
            echo "VERDICT: no Pages site — GitHub's own 404"
          elif grep -q 'src=\"/src/main.tsx\"' /tmp/body.html; then
            echo "VERDICT: Vite source template — Pages is serving the repo root"
          else
            echo "VERDICT: unrecognised content"
          fi
          echo "BOOT FALLBACK: $(grep -q 'Loading Baja SAE Standings' /tmp/body.html && echo present || echo absent)"
          echo '--- first 1200 bytes ---'
          head -c 1200 /tmp/body.html
          echo
          echo '--- end ---'

          size=$(wc -c < /tmp/body.html | tr -d ' ')

          # Same detail into the run summary for a human reading the UI.
          {
            echo "## Probe of $SITE"
            echo
            echo "HTTP **$code**, $(wc -c < /tmp/body.html | tr -d ' ') bytes"
            echo
            echo '### Referenced assets'
            echo '```'
            grep -o '/bajasaestandings/[^"]*' /tmp/body.html | sort -u | while read -r path; do
              a=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://ccrocker13.github.io${path}")
              echo "  ${a:-000}  $path"
            done
            echo '```'
            echo '### Data payload'
            echo '```'
            curl -sS -o /dev/null -w '  summary.json: HTTP %{http_code}, %{size_download} bytes\n' \
              --max-time 30 "${SITE}data/summary.json"
            echo '```'
            echo '### First 2 KB of body'
            echo '```html'
            head -c 2000 /tmp/body.html
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # This job reports; it does not fail. A red X on a diagnostic is
          # indistinguishable from a broken diagnostic, and that ambiguity has
          # already cost real debugging time here. The verdict above is the
          # output; deploy.yml is what gates shipping.
          if grep -q '/assets/index-' /tmp/body.html; then
            echo "PROBE OK: the built site is being served."
          else
            echo "::warning::The published URL is not serving the built site (HTTP $code). See the verdict above."
          fi
