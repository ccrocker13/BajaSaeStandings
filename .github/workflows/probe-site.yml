# Fetches the published site and reports exactly what is being served.
#
# The development environment cannot reach ccrocker13.github.io (egress policy),
# so when the live site misbehaves there is no way to inspect it from there.
# A runner can. This prints the real response so a diagnosis rests on the served
# bytes rather than on inference.
name: Probe published site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-site.yml'

permissions:
  contents: read
  # Lets the job read the repository's Pages configuration, which is the
  # authoritative answer to "what does Settings -> Pages actually say".
  pages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read the repository's Pages configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "=== Pages configuration (HTTP $code) ==="
          if [ "$code" = "404" ]; then
            echo "VERDICT: GitHub Pages is NOT ENABLED for this repository."
            echo "         Fix: Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
          else
            jq -r '"  status:     \(.status)\n  build_type: \(.build_type)\n  url:        \(.url)\n  html_url:   \(.html_url)\n  source:     \(.source)\n  public:     \(.public)"' /tmp/pages.json 2>/dev/null || cat /tmp/pages.json
          fi

      - name: Fetch the published site
        shell: bash
        run: |
          # GitHub runs step shells as `bash -e`, so errexit is on unless it is
          # turned off here — a previous version of this step aborted on its
          # first non-zero command and reported nothing at all. This job exists
          # to describe a broken site, so no single failing command may end it.
          set +e
          set +o pipefail

          # Built from the repository name, which is what GitHub Pages uses for
          # a project site and which is case-sensitive. Hardcoding a lowercase
          # spelling here is what made an earlier probe report a 404 for a site
          # that was actually being served one capital letter away.
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          SITE="https://${OWNER}.github.io/${REPO}/"

          # Written to a file rather than piped into head: head closing the pipe
          # early makes curl exit 23, which also took this step down once.
          touch /tmp/body.html
          code=$(curl -sSL --max-time 30 -o /tmp/body.html -w '%{http_code}' "$SITE")
          [ -z "$code" ] && code=000

          # Print the verdict to stdout before anything else, so it survives
          # even if a later command misbehaves.
          echo "=== PROBE RESULT ==="
          echo "URL:   $SITE"
          echo "HTTP:  $code"
          echo "BYTES: $(wc -c < /tmp/body.html | tr -d ' ')"
          if grep -q '/assets/index-' /tmp/body.html; then
            echo "VERDICT: built site IS being served"
          elif grep -q "isn't a GitHub Pages site here" /tmp/body.html; then
            echo "VERDICT: no Pages site — GitHub's own 404"
          elif grep -q 'src=\"/src/main.tsx\"' /tmp/body.html; then
            echo "VERDICT: Vite source template — Pages is serving the repo root"
          else
            echo "VERDICT: unrecognised content"
          fi
          echo "BOOT FALLBACK: $(grep -q 'Loading Baja SAE Standings' /tmp/body.html && echo present || echo absent)"
          # Asset statuses on stdout, not only in the step summary: a summary
          # is not readable through the API, so a check that only lands there
          # cannot actually be used to verify anything remotely.
          echo '--- referenced assets ---'
          # Match only src/href values that are root-relative, so an external
          # link whose URL happens to contain the repository name — the GitHub
          # issues link in the boot fallback, for instance — is not stripped of
          # its host and then reported as a 404 on our own site.
          grep -oE '(src|href)="/'"${REPO}"'/[^"]*"' /tmp/body.html \
            | sed -E 's/^(src|href)="//; s/"$//' | sort -u | while read -r path; do
            a=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://${OWNER}.github.io${path}")
            echo "  ${a:-000}  $path"
          done
          echo '--- data payload ---'
          dcode=$(curl -sS --max-time 30 -o /tmp/summary.json -w '%{http_code}' "${SITE}data/summary.json")
          dsize=$(wc -c < /tmp/summary.json | tr -d ' ')
          echo "  ${dcode}  ${dsize} bytes  data/summary.json"
          # Check the shape, not just that a file arrived. A deploy can serve a
          # perfectly valid page over stale or wrong data, and the browser smoke
          # test would not notice because the page still renders.
          if [ "$dcode" = "200" ]; then
            seasons=$(grep -o '"year":' /tmp/summary.json | wc -l | tr -d ' ')
            podium=$(grep -c '"podium"' /tmp/summary.json || true)
            teams=$(grep -o '"schoolId":' /tmp/summary.json | wc -l | tr -d ' ')
            echo "  seasons: ${seasons}  podium blocks: ${podium}  team/podium refs: ${teams}"
            if [ "$podium" -gt 0 ]; then
              echo "  data shape: podium present"
            else
              echo "  data shape: NO podium field — the deployed data predates the podium rework"
            fi
          fi
          echo '--- end ---'

          size=$(wc -c < /tmp/body.html | tr -d ' ')

          # Same detail into the run summary for a human reading the UI.
          {
            echo "## Probe of $SITE"
            echo
            echo "HTTP **$code**, $(wc -c < /tmp/body.html | tr -d ' ') bytes"
            echo
            echo '### Referenced assets'
            echo '```'
            grep -oE '(src|href)="/'"${REPO}"'/[^"]*"' /tmp/body.html \
              | sed -E 's/^(src|href)="//; s/"$//' | sort -u | while read -r path; do
              a=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://${OWNER}.github.io${path}")
              echo "  ${a:-000}  $path"
            done
            echo '```'
            echo '### Data payload'
            echo '```'
            curl -sS -o /dev/null -w '  summary.json: HTTP %{http_code}, %{size_download} bytes\n' \
              --max-time 30 "${SITE}data/summary.json"
            echo '```'
            echo '### First 2 KB of body'
            echo '```html'
            head -c 2000 /tmp/body.html
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # This job reports; it does not fail. A red X on a diagnostic is
          # indistinguishable from a broken diagnostic, and that ambiguity has
          # already cost real debugging time here. The verdict above is the
          # output; deploy.yml is what gates shipping.
          if grep -q '/assets/index-' /tmp/body.html; then
            echo "PROBE OK: the built site is being served."
          else
            echo "::warning::The published URL is not serving the built site (HTTP $code). See the verdict above."
          fi
