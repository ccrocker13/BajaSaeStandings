# Captures the upstream Baja SAE results HTML from a GitHub-hosted runner.
#
# Why this exists: the development environment cannot reach bajasae.net at all
# (egress policy returns 403), so parsers cannot be written by inspection. This
# workflow fetches the pages from a runner that does have open internet, commits
# the raw HTML as a test corpus, and emits a compact structural digest of each
# page so the markup can be reviewed without wading through VIEWSTATE blobs.
#
# Re-run it by editing tools/capture/urls.tsv and pushing.
name: Capture fixtures

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/capture/urls.tsv'
      - 'tools/capture/outline.mjs'
      - '.github/workflows/capture-fixtures.yml'

permissions:
  contents: write

concurrency:
  group: capture-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install digest dependency
        run: npm install --no-save --no-package-lock node-html-parser@6

      - name: Fetch pages
        env:
          # Identify ourselves honestly. If SAE ever wants us to stop, they need
          # a way to see who is asking and where to complain.
          UA: 'BajaSaeStandings/0.1 (+https://github.com/ccrocker13/BajaSaeStandings) fixture-capture'
        run: |
          set -uo pipefail
          mkdir -p packages/parser/fixtures
          : > packages/parser/fixtures/MANIFEST.md
          {
            echo "# Capture manifest"
            echo
            echo "Captured: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| name | status | type | bytes | url |"
            echo "|---|---|---|---|---|"
          } >> packages/parser/fixtures/MANIFEST.md

          # Read name<TAB>url, skipping comments and blank lines.
          grep -v '^\s*#' tools/capture/urls.tsv | grep -v '^\s*$' | while IFS=$'\t' read -r name url; do
            [ -z "${name:-}" ] && continue
            echo "::group::$name  $url"
            # --fail-with-body keeps error pages (a 500 page still tells us something).
            # Retries cover transient upstream hiccups without hammering.
            code=$(curl -sS --location \
                        --retry 3 --retry-delay 2 --retry-connrefused \
                        --max-time 60 \
                        --compressed \
                        -A "$UA" \
                        -w '%{http_code}' \
                        -o "packages/parser/fixtures/${name}.raw" \
                        "$url" || echo "000")
            ctype=$(file -b --mime-type "packages/parser/fixtures/${name}.raw" 2>/dev/null || echo unknown)
            bytes=$(wc -c < "packages/parser/fixtures/${name}.raw" | tr -d ' ')

            # Give HTML an .html extension so editors and the parser tests behave.
            if head -c 2000 "packages/parser/fixtures/${name}.raw" | grep -qi '<html'; then
              mv "packages/parser/fixtures/${name}.raw" "packages/parser/fixtures/${name}.html"
              target="packages/parser/fixtures/${name}.html"
            else
              mv "packages/parser/fixtures/${name}.raw" "packages/parser/fixtures/${name}.txt"
              target="packages/parser/fixtures/${name}.txt"
            fi

            echo "| ${name} | ${code} | ${ctype} | ${bytes} | ${url} |" >> packages/parser/fixtures/MANIFEST.md

            node tools/capture/outline.mjs "$target" "$url" \
              > "packages/parser/fixtures/${name}.outline.txt" 2>&1 || \
              echo "digest failed for ${name}" > "packages/parser/fixtures/${name}.outline.txt"

            echo "status=$code bytes=$bytes -> $target"
            echo "::endgroup::"
          done

      - name: Surface robots.txt and digests in the run summary
        run: |
          {
            echo '## robots.txt'
            for f in packages/parser/fixtures/*robots*; do
              [ -e "$f" ] || continue
              echo "### $f"
              echo '```'
              head -c 2000 "$f"
              echo
              echo '```'
            done
            echo '## Manifest'
            cat packages/parser/fixtures/MANIFEST.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bajasae-fixtures
          path: packages/parser/fixtures/
          retention-days: 30

      - name: Commit fixtures
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A packages/parser/fixtures
          if git diff --cached --quiet; then
            echo 'No fixture changes.'
            exit 0
          fi
          # [skip ci] is belt-and-braces; the paths filter above already means a
          # fixtures-only commit cannot retrigger this workflow.
          git commit -m 'Capture upstream results fixtures [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
