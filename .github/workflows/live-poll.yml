# Fallback live feed for race weekend.
#
# Insurance for the Cloudflare Worker, which is the primary and fresher path.
# Start this manually when a competition begins; it polls for the requested
# duration and publishes snapshots to the `live-feed` branch, which the site
# reads if the Worker is unavailable.
#
# A job cannot outlive the six-hour ceiling, so run it for a few hours at a
# time and restart it as needed rather than trying to cover a whole weekend.
name: Live poll

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long to poll for (max 330)'
        default: '300'
      interval_seconds:
        description: 'Seconds between polls'
        default: '30'

permissions:
  contents: write

concurrency:
  group: live-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Poll and publish
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
          PUBLISH_DIR: /tmp/feed
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # An orphan branch keeps thousands of snapshot commits out of the
          # project's history; the poller amends and force-pushes a single
          # commit, so it never accumulates.
          mkdir -p /tmp/feed && cd /tmp/feed
          git init -q
          git -c init.defaultBranch=live-feed checkout -q -b live-feed
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # The credential lives in the remote URL so the poller can push on its
          # own. `git remote add` does not echo its argument, and the poller
          # never prints git's stderr, so the token stays out of the log.
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"

          # The poller publishes each update as it happens. It must not wait for
          # the run to finish: a five-hour job would then serve one snapshot,
          # five hours late.
          cd "$GITHUB_WORKSPACE"
          OUT_FILE=/tmp/feed/live.json pnpm exec tsx tools/live-snapshot/poll.ts
